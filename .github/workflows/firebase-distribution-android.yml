name: Build & Distribute Android

on:
  push:
    branches:
      - development

  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # ----------------------------
      # Create local.properties
      # ----------------------------
      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          NUTRISCAN_BASE_URL=${{ secrets.NUTRISCAN_BASE_URL }}
          KEYCLOAK_BASE_URL=${{ secrets.KEYCLOAK_BASE_URL }}
          NEWS_API_BASE_URL=${{ secrets.NEWS_API_BASE_URL }}
          NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
          EXERCISES_API_BASE_URL=${{ secrets.EXERCISES_API_BASE_URL }}
          NUTRI_GPT_BASE_URL=${{ secrets.NUTRI_GPT_BASE_URL }}
          EOF

      # ----------------------------
      # Decode keystore
      # ----------------------------
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > app/keystore1

      # ----------------------------
      # Create keystore.properties
      # ----------------------------
      - name: Create keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore1
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ----------------------------
      # Create google-services.json
      # ----------------------------
      - name: Create google-services.json
        run: |
          cat > app/google-services.json <<EOF
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      # ----------------------------
      # Build Release APK
      # ----------------------------
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # ----------------------------
      # Upload Artifact
      # ----------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # ----------------------------
      # Firebase Distribution
      # ----------------------------
      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: Android
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            Commit: ${{ github.event.head_commit.message }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}